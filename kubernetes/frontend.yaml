apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardcreator-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cardcreator-frontend
  template:
    metadata:
      labels:
        app: cardcreator-frontend
    spec:
      containers:
        - name: cardcreator-frontend
          image: cardcreator_frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cardcreator-frontend-entrypoint
spec:
  selector:
    app: cardcreator-frontend
  ports:
    - port: 80
      targetPort: 80
