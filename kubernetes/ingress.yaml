apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /service/
            pathType: Prefix
            backend:
              service:
                name: service
                port:
                  number: 42611
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
