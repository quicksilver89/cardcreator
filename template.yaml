AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: "http://dynamodb:8000"
        CARD_TABLE_NAME: !Ref CardTable
  Api:
    Cors:
      AllowMethods: "'POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:
  CardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CardTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsiPk
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: InsertionOrderIndex
          KeySchema:
            - AttributeName: gsiPk
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ListCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: card_creator/card_data
      Handler: cardcreator.carddata.handlers.ListCardsHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/listcards
            Method: get

  GetCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: card_creator/card_data
      Handler: cardcreator.carddata.handlers.GetCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/getcard
            Method: post

  NewCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: card_creator/card_data
      Handler: cardcreator.carddata.handlers.NewCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/newcard
            Method: post

  EditCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: card_creator/card_data
      Handler: cardcreator.carddata.handlers.EditCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/editcard
            Method: post

  EchoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: card_creator/card_data
      Handler: cardcreator.carddata.handlers.DeleteCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/deletecard
            Method: post