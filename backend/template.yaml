AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ""
        DYNAMODB_ACCESS_KEY_ID: ""
        DYNAMODB_SECRET_ACCESS_KEY: ""
        CARD_TABLE_NAME: !Ref CardTable

Resources:
  CardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CardTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsiPk
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: InsertionOrderIndex
          KeySchema:
            - AttributeName: gsiPk
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ListCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/control/aws
      Handler: cardcreator.aws.handlers.ListCardsHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/listcards
            Method: get

  GetCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/control/aws
      Handler: cardcreator.aws.handlers.GetCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/getcard
            Method: post

  NewCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/control/aws
      Handler: cardcreator.aws.handlers.NewCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/newcard
            Method: post

  EditCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/control/aws
      Handler: cardcreator.aws.handlers.EditCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/editcard
            Method: post

  DeleteCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/control/aws
      Handler: cardcreator.aws.handlers.DeleteCardHandler::handleRequest
      Runtime: java25
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CardTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /service/deletecard
            Method: post

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Join ["", ["arn:aws:s3:::", !Ref FrontendBucket, "/*"]]
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: "/Prod"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

        CacheBehaviors:
          - PathPattern: "/service/*"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
            ForwardedValues:
              QueryString: true
              Headers:
                - Content-Type
                - Authorization
              Cookies:
                Forward: all

Outputs:
  CloudFrontURL:
    Description: "CloudFront distribution domain (use this as your site URL)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
