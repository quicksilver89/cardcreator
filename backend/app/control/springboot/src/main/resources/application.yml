server:
  port: 3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

dynamodb:
  endpoint: http://localhost:42619
  accesskeyid: none
  secretaccesskey: none
  awsregion: us-east-1
  tablename: CardTable

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/cardcreator
          jwk-set-uri: http://localhost:8080/realms/cardcreator/protocol/openid-connect/certs